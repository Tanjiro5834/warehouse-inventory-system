# ===== Global application theme defaults (both light & dark) =====
# Accent color (blue) \u2013 overridden in light/dark files where needed
@accentColor = #2F6FED

# Status colors
Inventory.inStockColor = #2E7D32
Inventory.lowStockColor = #F9A825
Inventory.outOfStockColor = #C62828

# Chart colors
Inventory.chartGridColor = #E0E0E0
Inventory.chartBarInColor = @accentColor
Inventory.chartBarOutColor = #FF7043

# Surface tokens
Inventory.sidebarBackground = darken(@background, 3%)
Inventory.cardBackground = @background
Inventory.cardBorderColor = @borderColor

# Typography helpers (FlatLaf style classes handle h1/h2/large/small)
# Component rounding
Component.arc = 10
Button.arc = 10

# Table styling
Table.rowHeight = 36
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0, 0
Table.selectionArc = 8